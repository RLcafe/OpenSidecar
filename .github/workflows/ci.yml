# Builds and tests both apps on every push and pull request, the same way as on the PC:
# scripts\build.ps1 -Test (Windows app and its checks), scripts\package.ps1 -Test (setup exe and its sandboxed checks)
# and scripts\build-android.ps1 -Test (APK and the core checks on the JVM). One Windows job, because the Android
# checks read the phone-link answer that the Windows checks save (artifacts\tests\remote-state-sample.json).
# Changes that only touch Markdown, docs\ or the read-only spec don't start a run.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design specfication/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design specfication/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Windows and Android tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      # Full history and tags: the builds take their version from the newest vX.Y.Z tag (git describe).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The pinned, hash-checked LibreHardwareMonitor files (decision 016). Optional: without them the app builds
      # and says the sensors aren't installed, so a failed download doesn't fail the run.
      - name: Hardware sensor files
        continue-on-error: true
        run: .\scripts\get-sensors.ps1

      - name: Windows app and checks
        run: .\scripts\build.ps1 -Test

      - name: Setup exe and checks
        run: .\scripts\package.ps1 -Test

      - name: Android app and checks
        run: .\scripts\build-android.ps1 -Test

      # Test builds for trying a branch. The APK is signed with the runner's own debug key, so it won't install
      # over a phone build made on the PC; uninstall that first.
      - name: Upload test builds
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: widget-screen-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/app/WidgetScreen.exe
            artifacts/app/WidgetScreen.exe.config
            artifacts/app/ClaudeHook.exe
            artifacts/setup/*.exe
            artifacts/android/WidgetScreen.apk
            artifacts/tests/remote-state-sample.json
